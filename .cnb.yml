# 海纳文档站 CNB 仓库（内容源）的流水线配置
#
# 本仓即内容源，`.cnb.yml` 位于仓库根目录、随 push 生效。
#
# 内容源与发布源分离是本方案的核心：
#
#   CNB 文档仓 haina-docs（本文件，内容源，私有）
#        │  提交即单向同步
#        ▼
#   GitHub 文档仓（发布源，公开）
#        │  .github/workflows/docs.yml：校验配置面 → 构建 → 发布 Pages
#        ▼
#   GitHub Pages
#
# 为什么不在 CNB 侧构建发布：站点发布在 GitHub Pages，让 GitHub Actions 基于
# 「被发布的那份内容」构建，避免 CNB 构建产物与 GitHub 上的内容版本漂移。
# 因此本仓 CI 只负责把内容同步过去，发布与校验都在 GitHub 侧做。

main:
  push:
    - imports: https://cnb.cool/h1s97x/secret-env/-/blob/main/env.yml
      name: sync to github
      stages:
        - name: sync to github
          image: tencentcom/git-sync
          settings:
            # 发布源仓库（GitHub 上的文档仓，需已开启 Pages）
            target_url: https://github.com/h1s97x/haina-docs.git
            auth_type: https
            username: ${GITHUB_USERNAME}
            password: ${GITHUB_TOKEN}
            branch: main
            # rebase 而非默认 push：默认模式是非快进即失败，而发布源上曾出现
            # 「应用仓直推工件」这类本站没有的提交，导致同步连续失败且不易察觉
            # （配置面工件 v0.3.1~v0.3.5 就是这样卡在 GitHub 侧、本站完全不知情）。
            # rebase 会把本站的新提交叠到发布源之上，两边都保留；真正的冲突仍会失败。
            sync_mode: rebase
